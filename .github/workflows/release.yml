name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/bun/install.js
      - run: npm run check && npm test && npm run build
      - run: npm run smoke
      - run: cp dist/imagegen dist/imagegen-linux-x64
      - run: cd dist && sha256sum imagegen-linux-x64 > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/imagegen-linux-x64 dist/SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
